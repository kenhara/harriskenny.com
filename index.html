<!DOCTYPE html>
<html lang="en" data-era="omarchy" data-device="desktop">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harris Kenny</title>
  <meta name="description" content="Harris Kenny, founder of OutboundSync. A little ode to a computing journey.">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

<body>
  <div class="tm">
    <div class="tm-title"><span class="tm-word">Time Machine</span><strong id="tm-era">Omarchy</strong></div>
    <div class="tm-track" id="tm-track" role="slider" tabindex="0" aria-label="Computer history" aria-valuemin="0" aria-valuemax="8" aria-valuenow="8" aria-valuetext="Omarchy">
      <div class="tm-line"></div>
      <div class="tm-ticks" id="tm-ticks"></div>
      <div class="tm-handle" id="tm-handle"></div>
    </div>
  </div>

  <div class="os">
    <header class="menubar" id="menubar"></header>
    <header class="panel-top" id="panel-top"></header>
    <div class="desktop">
      <nav class="board" id="board" aria-label="Desktop"></nav>
      <div class="go-menu" id="go-menu" hidden></div>
      <div class="activities" id="activities" hidden></div>
      <div id="windows"></div>
      <footer class="dock" id="dock"></footer>
      <div class="start-menu" id="start-menu"></div>
      <div class="phone" id="phone" hidden>
        <div class="phone-bezel">
          <div class="phone-earpiece" aria-hidden="true"></div>
          <div class="phone-island" aria-hidden="true"></div>
          <div class="phone-status" id="phone-status">
            <span class="phone-carrier" id="phone-carrier">Carrier</span>
            <span class="phone-time" id="phone-time"></span>
            <span class="phone-batt" aria-hidden="true"></span>
          </div>
          <div class="phone-screen">
            <div class="phone-home" id="phone-home"></div>
            <div class="phone-sheet" id="phone-sheet" hidden>
              <div class="phone-sheet-bar" id="phone-sheet-bar">
                <button type="button" class="phone-back" id="phone-back" aria-label="Back">Back</button>
                <span class="phone-sheet-title" id="phone-sheet-title"></span>
              </div>
              <div class="phone-sheet-body" id="phone-sheet-body"></div>
            </div>
          </div>
          <div class="phone-softkeys" id="phone-softkeys">
            <button type="button" class="phone-sk phone-sk-l" id="phone-sk-l">Back</button>
            <button type="button" class="phone-sk phone-sk-c" id="phone-sk-c">Select</button>
            <button type="button" class="phone-sk phone-sk-r" id="phone-sk-r"></button>
          </div>
          <button type="button" class="phone-home-btn" id="phone-home-btn" aria-label="Home"></button>
          <div class="phone-gesture" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <footer class="taskbar">
      <button class="start" type="button" id="start">Start</button>
      <div class="tasks" id="tasks"></div>
      <div class="tray"><span id="clock"></span></div>
    </footer>
  </div>

  <script>window.__V = "1788528000";</script>
