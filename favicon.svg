<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Harris Kenny — Time Machine</title>
  <!-- night field -->
  <rect width="32" height="32" rx="6" fill="#111318"/>
  <!-- soft timeline track -->
  <rect x="4" y="15" width="24" height="2" rx="1" fill="#3a4150"/>
  <!-- era ticks -->
  <rect x="6" y="13" width="1.5" height="6" rx="0.5" fill="#5a6478"/>
  <rect x="12" y="13" width="1.5" height="6" rx="0.5" fill="#5a6478"/>
  <rect x="18" y="13" width="1.5" height="6" rx="0.5" fill="#5a6478"/>
  <rect x="24" y="13" width="1.5" height="6" rx="0.5" fill="#5a6478"/>
  <!-- gold Time Machine handle -->
  <circle cx="22" cy="16" r="6" fill="#e8b84a"/>
  <circle cx="22" cy="16" r="6" fill="url(#g)" fill-opacity="0.9"/>
  <circle cx="22" cy="16" r="3.2" fill="#1a1d24"/>
  <circle cx="20.5" cy="14.5" r="1.4" fill="#fff4c8" fill-opacity="0.55"/>
  <defs>
    <radialGradient id="g" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="55%" stop-color="#e8b84a"/>
      <stop offset="100%" stop-color="#b07a18"/>
    </radialGradient>
  </defs>
</svg>
